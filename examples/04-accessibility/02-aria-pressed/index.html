      <head>

        <style>

      <body>
        <main>
          <p class="eyebrow">04-accessibility / 02-aria-pressed</p>
          <h1>Sync toggle state with aria-pressed</h1>
          <p class="summary">押し込み状態を表す toggle button の最小例です。見た目の状態と `aria-pressed` を必ず一致させます。</p>
          <ul class="nav"><li><a href="../../index.html">examples index</a></li><li><a href="../01-native-button/index.html">← previous</a></li><li><a href="../03-described-by/index.html">next →</a></li></ul>
          <section class="demo">

<div class="stack">
  <favorite-toggle id="favorite-toggle" pressed></favorite-toggle>
  <p id="favorite-log" class="hint">状態: pressed</p>
</div>

          </section>
        </main>
        <script>

class FavoriteToggle extends HTMLElement {
  static observedAttributes = ['pressed'];

  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
  }

  connectedCallback() {
    this.render();
  }

  attributeChangedCallback() {
    this.render();
  }

  get pressed() {
    return this.hasAttribute('pressed');
  }

  set pressed(value) {
    if (value) {
      this.setAttribute('pressed', '');
    } else {
      this.removeAttribute('pressed');
    }
  }

  toggle() {
    this.pressed = !this.pressed;
    this.dispatchEvent(new CustomEvent('pressed-change', {
      detail: { pressed: this.pressed },
      bubbles: true,
      composed: true,
    }));
  }

  render() {
    this.shadowRoot.innerHTML = `
      <style>
        button {
          border: 0;
          border-radius: 999px;
          background: ${this.pressed ? '#f59e0b' : '#e2e8f0'};
          color: ${this.pressed ? '#111827' : '#334155'};
          padding: 12px 18px;
          cursor: pointer;
          font-weight: 700;
        }
      </style>
      <button type="button" aria-pressed="${this.pressed ? 'true' : 'false'}">
        ${this.pressed ? 'Favorited' : 'Add to favorites'}
      </button>
    `;

    this.shadowRoot.querySelector('button').addEventListener('click', () => this.toggle());
  }
}

customElements.define('favorite-toggle', FavoriteToggle);

const favoriteToggle = document.getElementById('favorite-toggle');
const favoriteLog = document.getElementById('favorite-log');
favoriteToggle.addEventListener('pressed-change', (event) => {
  favoriteLog.textContent = `状態: ${event.detail.pressed ? 'pressed' : 'not pressed'}`;
});

        </script>
      </body>
