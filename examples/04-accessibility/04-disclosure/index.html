        <main>
          <p class="eyebrow">04-accessibility / 04-disclosure</p>
          <h1>Reveal content with aria-expanded and aria-controls</h1>
          <p class="summary">disclosure pattern では、ボタンの状態と、開閉対象の領域を同時に公開します。</p>
          <ul class="nav"><li><a href="../../index.html">examples index</a></li><li><a href="../03-described-by/index.html">← previous</a></li><li><a href="../05-switch/index.html">next →</a></li></ul>
          <section class="demo">

<faq-disclosure question="Why use Shadow DOM?">
  Shadow DOM lets you isolate internal DOM and styles so global CSS and selectors do not accidentally leak in.
</faq-disclosure>

          </section>
        </main>
        <script>

let disclosureId = 0;

class FaqDisclosure extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
    this.panelId = `disclosure-panel-${++disclosureId}`;
    this.buttonId = `disclosure-button-${disclosureId}`;
    this.expanded = false;
  }

  connectedCallback() {
    this.render();
  }

  toggle() {
    this.expanded = !this.expanded;
    this.render();
  }

  render() {
    const question = this.getAttribute('question') ?? 'Question';
    this.shadowRoot.innerHTML = `
      <style>
        article {
          padding: 22px;
          border-radius: 20px;
          background: white;
          border: 1px solid #dbeafe;
        }

        button {
          inline-size: 100%;
          text-align: left;
          border: 0;
          border-radius: 14px;
          background: #eff6ff;
          padding: 14px 16px;
          color: #1d4ed8;
          font-weight: 700;
          cursor: pointer;
        }

        [role="region"] {
          margin-top: 14px;
          color: #334155;
          display: ${this.expanded ? 'block' : 'none'};
        }
      </style>
      <article>
        <button id="${this.buttonId}" type="button" aria-expanded="${this.expanded ? 'true' : 'false'}" aria-controls="${this.panelId}">
          ${question}
        </button>
        <div id="${this.panelId}" role="region" aria-labelledby="${this.buttonId}">
          <slot></slot>
        </div>
      </article>
    `;

    this.shadowRoot.querySelector('button').addEventListener('click', () => this.toggle());
  }
}

customElements.define('faq-disclosure', FaqDisclosure);

        </script>
