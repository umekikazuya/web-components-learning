<!doctype html>
<html lang="ja">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Create your first Shadow DOM</title>
	<link rel="stylesheet" href="../../shared/example-page.css">
	<style>
		.card {
			padding: 22px;
			border-radius: 20px;
			background: #fee2e2;
			border: 3px dashed #ef4444;
		}

		button {
			border: 0;
			border-radius: 999px;
			background: #111827;
			color: white;
			padding: 10px 16px;
		}
	</style>
</head>

<body>
	<main>
		<p class="eyebrow">02-shadow-dom / 02-first-shadow</p>
		<h1>Create your first Shadow DOM</h1>
		<p class="summary">同じような UI を Shadow DOM へ入れると、ページ側 CSS の影響を遮断できることがわかります。</p>

		<ul class="nav">
			<li><a href="../../index.html">examples index</a></li>
			<li><a href="../01-without-shadow/index.html">← previous</a></li>
			<li><a href="../03-template/index.html">next →</a></li>
		</ul>

		<section class="demo">

			<shadow-profile-card></shadow-profile-card>
			<p class="hint">まず 01 と見比べて、同じ page CSS があっても内部ボタンの見た目が守られることを見てください。</p>

		</section>
	</main>

	<script>

		class ShadowProfileCard extends HTMLElement {
			constructor() {
				super();
				this.attachShadow({mode: 'open'});
			}

			connectedCallback() {
				this.shadowRoot.innerHTML = `
      <style>
        article {
          padding: 22px;
          border-radius: 20px;
          background: white;
          border: 1px solid #bfdbfe;
          box-shadow: 0 20px 40px -32px rgba(15, 23, 42, 0.4);
        }

        button {
          border: 0;
          border-radius: 999px;
          background: #2563eb;
          color: white;
          padding: 10px 16px;
          cursor: pointer;
        }
      </style>
      <article>
        <h2>With Shadow DOM</h2>
        <p>内部の DOM とスタイルを閉じ込められます。</p>
        <button type="button">Scoped button</button>
      </article>
    `;
			}
		}

		customElements.define('shadow-profile-card', ShadowProfileCard);

	</script>
</body>

</html>
