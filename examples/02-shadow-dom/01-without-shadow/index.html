<!doctype html>
<html lang="ja">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Start without Shadow DOM</title>
    <link rel="stylesheet" href="../../shared/example-page.css">
	<style>
.card {
			padding: 22px;
			border-radius: 20px;
			background: #fee2e2;
			border: 3px dashed #ef4444;
		}

		button {
			border: 0;
			border-radius: 999px;
			background: #111827;
			color: white;
			padding: 10px 16px;
		}
    
    </style>
</head>

<body>
	<main>
		<p class="eyebrow">02-shadow-dom / 01-without-shadow</p>
		<h1>Start without Shadow DOM</h1>
		<p class="summary">同じマークアップでも、Shadow DOM を使わないとページ全体の CSS がそのまま混ざることを見ます。</p>

		<ul class="nav">
			<li><a href="../../index.html">examples index</a></li>
			<li><a href="../02-first-shadow/index.html">next →</a></li>
		</ul>

		<section class="demo">

			<plain-profile-card></plain-profile-card>
			<p class="hint">まずカードの見た目を見て、ページ側 CSS が component の中まで漏れていることを確認してください。</p>

		</section>
	</main>

	<script>

		class PlainProfileCard extends HTMLElement {
			connectedCallback() {
				this.innerHTML = `
      <article class="card">
        <h2>Without Shadow DOM</h2>
        <p>外側のページ CSS がそのまま入り込みます。</p>
        <button type="button">Leaky button</button>
      </article>
    `;
			}
		}

		customElements.define('plain-profile-card', PlainProfileCard);

	</script>
</body>

</html>
