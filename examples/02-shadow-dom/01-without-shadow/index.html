<!doctype html>
<html lang="ja">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Start without Shadow DOM</title>
	<style>
		:root {
			color-scheme: light;
			font-family: Inter, system-ui, sans-serif;
			line-height: 1.6;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			background: #f8fafc;
			color: #0f172a;
		}

		main {
			max-width: 980px;
			margin: 0 auto;
			padding: 36px 20px 72px;
		}

		.eyebrow {
			margin: 0 0 8px;
			color: #2563eb;
			font-weight: 700;
			font-size: 0.875rem;
		}

		h1 {
			margin: 0 0 12px;
			font-size: clamp(2rem, 4vw, 2.8rem);
		}

		p {
			margin-top: 0;
		}

		.summary {
			max-width: 68ch;
			color: #475569;
		}

		.nav {
			display: flex;
			gap: 12px;
			flex-wrap: wrap;
			padding: 0;
			margin: 24px 0 0;
			list-style: none;
		}

		.nav a {
			display: inline-flex;
			align-items: center;
			padding: 8px 12px;
			border-radius: 999px;
			background: white;
			border: 1px solid #dbeafe;
			color: #2563eb;
			text-decoration: none;
		}

		.demo {
			margin-top: 28px;
			padding: 24px;
			border-radius: 24px;
			background: white;
			border: 1px solid #e2e8f0;
			box-shadow: 0 24px 48px -36px rgba(15, 23, 42, 0.45);
		}

		.hint {
			margin-top: 20px;
			padding: 14px 16px;
			border-radius: 16px;
			background: #eff6ff;
			color: #1d4ed8;
		}

		.stack {
			display: grid;
			gap: 16px;
		}

		.grid {
			display: grid;
			gap: 16px;
			grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
		}

		button,
		select {
			font: inherit;
		}


		.card {
			padding: 22px;
			border-radius: 20px;
			background: #fee2e2;
			border: 3px dashed #ef4444;
		}

		button {
			border: 0;
			border-radius: 999px;
			background: #111827;
			color: white;
			padding: 10px 16px;
		}
	</style>
</head>

<body>
	<main>
		<p class="eyebrow">02-shadow-dom / 01-without-shadow</p>
		<h1>Start without Shadow DOM</h1>
		<p class="summary">同じマークアップでも、Shadow DOM を使わないとページ全体の CSS がそのまま混ざることを見ます。</p>

		<ul class="nav">
			<li><a href="../../index.html">examples index</a></li>
			<li><a href="../02-first-shadow/index.html">next →</a></li>
		</ul>

		<section class="demo">

			<plain-profile-card></plain-profile-card>
			<p class="hint">まずカードの見た目を見て、ページ側 CSS が component の中まで漏れていることを確認してください。</p>

		</section>
	</main>

	<script>

		class PlainProfileCard extends HTMLElement {
			connectedCallback() {
				this.innerHTML = `
      <article class="card">
        <h2>Without Shadow DOM</h2>
        <p>外側のページ CSS がそのまま入り込みます。</p>
        <button type="button">Leaky button</button>
      </article>
    `;
			}
		}

		customElements.define('plain-profile-card', PlainProfileCard);

	</script>
</body>

</html>
