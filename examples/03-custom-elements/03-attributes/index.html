    <!doctype html>
    <html lang="ja">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Reflect attributes into UI</title>
        <style>
          :root {
            color-scheme: light;
            font-family: Inter, system-ui, sans-serif;
            line-height: 1.6;
          }

          * {
            box-sizing: border-box;
          }

          body {
            margin: 0;
            background: #f8fafc;
            color: #0f172a;
          }

          main {
            max-width: 980px;
            margin: 0 auto;
            padding: 36px 20px 72px;
          }

          .eyebrow {
            margin: 0 0 8px;
            color: #2563eb;
            font-weight: 700;
            font-size: 0.875rem;
          }

          h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 4vw, 2.8rem);
          }

          p {
            margin-top: 0;
          }

          .summary {
            max-width: 68ch;
            color: #475569;
          }

          .nav {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            padding: 0;
            margin: 24px 0 0;
            list-style: none;
          }

          .nav a {
            display: inline-flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 999px;
            background: white;
            border: 1px solid #dbeafe;
            color: #2563eb;
            text-decoration: none;
          }

          .demo {
            margin-top: 28px;
            padding: 24px;
            border-radius: 24px;
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 24px 48px -36px rgba(15, 23, 42, 0.45);
          }

          .hint {
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: 16px;
            background: #eff6ff;
            color: #1d4ed8;
          }

          .stack {
            display: grid;
            gap: 16px;
          }

          .grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
          }

          button,
          select {
            font: inherit;
          }


  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .controls button {
    border: 1px solid #cbd5e1;
    border-radius: 999px;
    background: white;
    padding: 8px 14px;
    cursor: pointer;
  }

        </style>
      </head>
      <body>
        <main>
          <p class="eyebrow">03-custom-elements / 03-attributes</p>
          <h1>Reflect attributes into UI</h1>
          <p class="summary">属性変更を検知して再描画する最小パターンです。ボタンで値を変えながら `observedAttributes` を確認します。</p>

          <ul class="nav"><li><a href="../../index.html">examples index</a></li><li><a href="../02-lifecycle/index.html">← previous</a></li><li><a href="../04-practical-card/index.html">next →</a></li></ul>

          <section class="demo">

<div class="stack">
  <status-pill id="pill" label="Draft" tone="neutral"></status-pill>
  <div class="controls">
    <button type="button" data-label="Draft">Draft</button>
    <button type="button" data-label="Ready">Ready</button>
    <button type="button" data-tone="neutral">neutral</button>
    <button type="button" data-tone="success">success</button>
  </div>
</div>

          </section>
        </main>

        <script>

class StatusPill extends HTMLElement {
  static observedAttributes = ['label', 'tone'];

  connectedCallback() {
    this.render();
  }

  attributeChangedCallback() {
    this.render();
  }

  render() {
    const label = this.getAttribute('label') ?? 'Draft';
    const tone = this.getAttribute('tone') ?? 'neutral';
    const styles = {
      neutral: ['#e2e8f0', '#334155'],
      success: ['#dcfce7', '#166534'],
    };
    const [background, color] = styles[tone] ?? styles.neutral;

    this.innerHTML = `<span style="display: inline-flex; padding: 10px 14px; border-radius: 999px; background: ${background}; color: ${color}; font-weight: 700;">${label}</span>`;
  }
}

customElements.define('status-pill', StatusPill);

const pill = document.getElementById('pill');
document.querySelector('.controls').addEventListener('click', (event) => {
  const target = event.target;
  if (!(target instanceof HTMLButtonElement)) {
    return;
  }

  if (target.dataset.label) {
    pill.setAttribute('label', target.dataset.label);
  }

  if (target.dataset.tone) {
    pill.setAttribute('tone', target.dataset.tone);
  }
});

        </script>
      </body>
    </html>
