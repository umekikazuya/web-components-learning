      <body>
        <main>
          <p class="eyebrow">03-custom-elements / 02-lifecycle</p>
          <h1>Observe lifecycle callbacks</h1>
          <p class="summary">要素を mount / unmount して、`connectedCallback()` と `disconnectedCallback()` がいつ呼ばれるかを確認します。</p>

          <ul class="nav"><li><a href="../../index.html">examples index</a></li><li><a href="../01-define-element/index.html">← previous</a></li><li><a href="../03-attributes/index.html">next →</a></li></ul>

          <section class="demo">

<div class="stack">
  <button id="toggle-mount" type="button">mount / unmount を切り替える</button>
  <div id="mount-point"></div>
  <ul id="log"></ul>
</div>

          </section>
        </main>

        <script>

const log = document.getElementById('log');
const mountPoint = document.getElementById('mount-point');
const toggleMount = document.getElementById('toggle-mount');

function appendLog(message) {
  const item = document.createElement('li');
  item.textContent = message;
  log.prepend(item);
}

class LifecycleBox extends HTMLElement {
  connectedCallback() {
    appendLog('connectedCallback fired');
    this.innerHTML = '<div style="padding: 16px; border-radius: 16px; background: #dcfce7;">I am mounted.</div>';
  }

  disconnectedCallback() {
    appendLog('disconnectedCallback fired');
  }
}

customElements.define('lifecycle-box', LifecycleBox);

let mounted = true;

function render() {
  mountPoint.replaceChildren();
  if (mounted) {
    mountPoint.append(document.createElement('lifecycle-box'));
  }
}

toggleMount.addEventListener('click', () => {
  mounted = !mounted;
  render();
});

render();

        </script>
      </body>
