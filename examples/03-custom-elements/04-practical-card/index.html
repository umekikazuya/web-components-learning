    <!doctype html>
    <html lang="ja">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Build a practical card component</title>
        <style>
          :root {
            color-scheme: light;
            font-family: Inter, system-ui, sans-serif;
            line-height: 1.6;
          }

          * {
            box-sizing: border-box;
          }

          body {
            margin: 0;
            background: #f8fafc;
            color: #0f172a;
          }

          main {
            max-width: 980px;
            margin: 0 auto;
            padding: 36px 20px 72px;
          }

          .eyebrow {
            margin: 0 0 8px;
            color: #2563eb;
            font-weight: 700;
            font-size: 0.875rem;
          }

          h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 4vw, 2.8rem);
          }

          p {
            margin-top: 0;
          }

          .summary {
            max-width: 68ch;
            color: #475569;
          }

          .nav {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            padding: 0;
            margin: 24px 0 0;
            list-style: none;
          }

          .nav a {
            display: inline-flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 999px;
            background: white;
            border: 1px solid #dbeafe;
            color: #2563eb;
            text-decoration: none;
          }

          .demo {
            margin-top: 28px;
            padding: 24px;
            border-radius: 24px;
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 24px 48px -36px rgba(15, 23, 42, 0.45);
          }

          .hint {
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: 16px;
            background: #eff6ff;
            color: #1d4ed8;
          }

          .stack {
            display: grid;
            gap: 16px;
          }

          .grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
          }

          button,
          select {
            font: inherit;
          }


  .controls {
    display: flex;
    gap: 12px;
  }

  label {
    display: grid;
    gap: 8px;
    color: #475569;
  }

  select {
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid #cbd5e1;
    background: white;
  }

        </style>
      </head>
      <body>
        <main>
          <p class="eyebrow">03-custom-elements / 04-practical-card</p>
          <h1>Build a practical card component</h1>
          <p class="summary">定義・属性反映・Shadow DOM を合わせて、小さな実践コンポーネントへまとめます。</p>

          <ul class="nav"><li><a href="../../index.html">examples index</a></li><li><a href="../03-attributes/index.html">← previous</a></li></ul>

          <section class="demo">

<div class="stack">
  <div class="controls">
    <label>
      level
      <select id="level-select">
        <option value="intro">intro</option>
        <option value="deep">deep</option>
      </select>
    </label>
  </div>
  <resource-card id="resource-card" title="Shadow DOM patterns" level="intro" tag="reading"></resource-card>
  <p class="hint">内部の CTA には `aria-label` を与えてあり、次のアクセシビリティ拡張の土台にもできます。</p>
</div>

          </section>
        </main>

        <script>

class ResourceCard extends HTMLElement {
  static observedAttributes = ['title', 'level', 'tag'];

  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
  }

  connectedCallback() {
    this.render();
  }

  attributeChangedCallback() {
    this.render();
  }

  render() {
    const title = this.getAttribute('title') ?? 'Untitled';
    const level = this.getAttribute('level') ?? 'intro';
    const tag = this.getAttribute('tag') ?? 'note';
    const description = level === 'deep'
      ? 'Shadow boundary と styling API の関係を掘り下げます。'
      : 'まずは基本のふるまいをざっと掴む導入用カードです。';

    this.shadowRoot.innerHTML = `
      <style>
        article {
          padding: 22px;
          border-radius: 20px;
          background: white;
          border: 1px solid #dbeafe;
          box-shadow: 0 20px 40px -32px rgba(15, 23, 42, 0.45);
        }

        .tag {
          display: inline-flex;
          padding: 6px 10px;
          border-radius: 999px;
          background: #eff6ff;
          color: #1d4ed8;
          font-size: 0.875rem;
          font-weight: 700;
        }

        button {
          margin-top: 14px;
          border: 0;
          border-radius: 999px;
          background: #2563eb;
          color: white;
          padding: 10px 16px;
          cursor: pointer;
        }
      </style>
      <article>
        <span class="tag">${tag}</span>
        <h2>${title}</h2>
        <p>${description}</p>
        <button type="button" aria-label="${title} を開く">Read track</button>
      </article>
    `;
  }
}

customElements.define('resource-card', ResourceCard);

const card = document.getElementById('resource-card');
document.getElementById('level-select').addEventListener('change', (event) => {
  card.setAttribute('level', event.target.value);
});

        </script>
      </body>
    </html>
