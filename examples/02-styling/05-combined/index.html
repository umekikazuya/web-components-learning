    <!doctype html>
    <html lang="ja">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Combine styling APIs intentionally</title>
        <style>
          :root {
            color-scheme: light;
            font-family: Inter, system-ui, sans-serif;
            line-height: 1.6;
          }

          * {
            box-sizing: border-box;
          }

          body {
            margin: 0;
            background: #f8fafc;
            color: #0f172a;
          }

          main {
            max-width: 980px;
            margin: 0 auto;
            padding: 36px 20px 72px;
          }

          .eyebrow {
            margin: 0 0 8px;
            color: #2563eb;
            font-weight: 700;
            font-size: 0.875rem;
          }

          h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 4vw, 2.8rem);
          }

          p {
            margin-top: 0;
          }

          .summary {
            max-width: 68ch;
            color: #475569;
          }

          .nav {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            padding: 0;
            margin: 24px 0 0;
            list-style: none;
          }

          .nav a {
            display: inline-flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 999px;
            background: white;
            border: 1px solid #dbeafe;
            color: #2563eb;
            text-decoration: none;
          }

          .demo {
            margin-top: 28px;
            padding: 24px;
            border-radius: 24px;
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 24px 48px -36px rgba(15, 23, 42, 0.45);
          }

          .hint {
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: 16px;
            background: #eff6ff;
            color: #1d4ed8;
          }

          .stack {
            display: grid;
            gap: 16px;
          }

          .grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
          }

          button,
          select {
            font: inherit;
          }


  design-token-card::part(cta) {
    box-shadow: 0 12px 24px -16px rgba(15, 23, 42, 0.5);
  }

        </style>
      </head>
      <body>
        <main>
          <p class="eyebrow">02-styling / 05-combined</p>
          <h1>Combine styling APIs intentionally</h1>
          <p class="summary">最後に、custom properties・`:host`・`::part()` を組み合わせたときの責務分担を確認します。</p>

          <ul class="nav"><li><a href="../../index.html">examples index</a></li><li><a href="../04-part/index.html">← previous</a></li></ul>

          <section class="demo">

<div class="grid">
  <design-token-card title="Default theme"></design-token-card>
  <design-token-card title="Success theme" tone="success" style="--card-accent: #16a34a; --card-surface: #f0fdf4;"></design-token-card>
</div>

          </section>
        </main>

        <script>

class DesignTokenCard extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
  }

  connectedCallback() {
    const title = this.getAttribute('title') ?? 'Card';
    this.shadowRoot.innerHTML = `
      <style>
        :host {
          --card-accent: #2563eb;
          --card-surface: white;
        }

        :host([tone="success"]) article {
          border-color: color-mix(in srgb, var(--card-accent) 32%, white);
        }

        article {
          padding: 22px;
          border-radius: 20px;
          background: var(--card-surface);
          border: 1px solid #dbeafe;
        }

        .eyebrow {
          color: var(--card-accent);
          font-weight: 700;
        }

        button {
          border: 0;
          border-radius: 999px;
          background: var(--card-accent);
          color: white;
          padding: 10px 16px;
        }
      </style>
      <article>
        <p class="eyebrow">combined styling</p>
        <h2>${title}</h2>
        <p>外側から token を渡しつつ、一部だけ part として公開できます。</p>
        <button type="button" part="cta">Read more</button>
      </article>
    `;
  }
}

customElements.define('design-token-card', DesignTokenCard);

        </script>
      </body>
    </html>
