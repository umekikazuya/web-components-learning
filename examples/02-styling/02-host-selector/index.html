    <!doctype html>
    <html lang="ja">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Switch variants with :host()</title>
        <style>
          :root {
            color-scheme: light;
            font-family: Inter, system-ui, sans-serif;
            line-height: 1.6;
          }

          * {
            box-sizing: border-box;
          }

          body {
            margin: 0;
            background: #f8fafc;
            color: #0f172a;
          }

          main {
            max-width: 980px;
            margin: 0 auto;
            padding: 36px 20px 72px;
          }

          .eyebrow {
            margin: 0 0 8px;
            color: #2563eb;
            font-weight: 700;
            font-size: 0.875rem;
          }

          h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 4vw, 2.8rem);
          }

          p {
            margin-top: 0;
          }

          .summary {
            max-width: 68ch;
            color: #475569;
          }

          .nav {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            padding: 0;
            margin: 24px 0 0;
            list-style: none;
          }

          .nav a {
            display: inline-flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 999px;
            background: white;
            border: 1px solid #dbeafe;
            color: #2563eb;
            text-decoration: none;
          }

          .demo {
            margin-top: 28px;
            padding: 24px;
            border-radius: 24px;
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 24px 48px -36px rgba(15, 23, 42, 0.45);
          }

          .hint {
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: 16px;
            background: #eff6ff;
            color: #1d4ed8;
          }

          .stack {
            display: grid;
            gap: 16px;
          }

          .grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
          }

          button,
          select {
            font: inherit;
          }


        </style>
      </head>
      <body>
        <main>
          <p class="eyebrow">02-styling / 02-host-selector</p>
          <h1>Switch variants with :host()</h1>
          <p class="summary">` :host([attr]) ` を使うと、component の外側 API を属性として公開しながら内部見た目を切り替えられます。</p>

          <ul class="nav"><li><a href="../../index.html">examples index</a></li><li><a href="../01-css-custom-properties/index.html">← previous</a></li><li><a href="../03-host-context/index.html">next →</a></li></ul>

          <section class="demo">

<div class="stack">
  <status-banner>default variant</status-banner>
  <status-banner variant="danger">danger variant</status-banner>
</div>

          </section>
        </main>

        <script>

class StatusBanner extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
  }

  connectedCallback() {
    this.shadowRoot.innerHTML = `
      <style>
        :host {
          display: block;
        }

        :host([variant="danger"]) article {
          background: #fee2e2;
          border-color: #fecaca;
          color: #991b1b;
        }

        article {
          padding: 18px;
          border-radius: 18px;
          background: #eff6ff;
          border: 1px solid #bfdbfe;
          color: #1d4ed8;
        }
      </style>
      <article><slot></slot></article>
    `;
  }
}

customElements.define('status-banner', StatusBanner);

        </script>
      </body>
    </html>
