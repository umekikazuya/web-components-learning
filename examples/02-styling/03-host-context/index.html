            margin: 0 0 8px;

          }

          h1 {
            margin: 0 0 12px;

          p {
            margin-top: 0;

          .summary {
            max-width: 68ch;

          .nav {
            display: flex;

      <body>
        <main>
          <p class="eyebrow">02-styling / 03-host-context</p>
          <h1>React to surrounding context with :host-context()</h1>
          <p class="summary">周囲の container class に応じて component の見た目を調整するパターンです。テーマ切り替え時の考え方を掴みます。</p>

          <ul class="nav"><li><a href="../../index.html">examples index</a></li><li><a href="../02-host-selector/index.html">← previous</a></li><li><a href="../04-part/index.html">next →</a></li></ul>

          <section class="demo">

<div class="stack">
  <div class="surface">
    <context-note>light surface</context-note>
  </div>
  <div class="surface dark">
    <context-note>dark surface</context-note>
  </div>
</div>

          </section>
        </main>

        <script>

class ContextNote extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
  }

  connectedCallback() {
    this.shadowRoot.innerHTML = `
      <style>
        article {
          padding: 18px;
          border-radius: 18px;
          background: white;
          color: #0f172a;
        }

        :host-context(.dark) article {
          background: #0f172a;
          color: #f8fafc;
        }
      </style>
      <article><slot></slot></article>
    `;
  }
}

customElements.define('context-note', ContextNote);

        </script>
      </body>
