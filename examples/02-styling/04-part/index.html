    <!doctype html>
    <html lang="ja">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Expose internal elements with ::part()</title>
        <style>
          :root {
            color-scheme: light;
            font-family: Inter, system-ui, sans-serif;
            line-height: 1.6;
          }

          * {
            box-sizing: border-box;
          }

          body {
            margin: 0;
            background: #f8fafc;
            color: #0f172a;
          }

          main {
            max-width: 980px;
            margin: 0 auto;
            padding: 36px 20px 72px;
          }

          .eyebrow {
            margin: 0 0 8px;
            color: #2563eb;
            font-weight: 700;
            font-size: 0.875rem;
          }

          h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 4vw, 2.8rem);
          }

          p {
            margin-top: 0;
          }

          .summary {
            max-width: 68ch;
            color: #475569;
          }

          .nav {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            padding: 0;
            margin: 24px 0 0;
            list-style: none;
          }

          .nav a {
            display: inline-flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 999px;
            background: white;
            border: 1px solid #dbeafe;
            color: #2563eb;
            text-decoration: none;
          }

          .demo {
            margin-top: 28px;
            padding: 24px;
            border-radius: 24px;
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 24px 48px -36px rgba(15, 23, 42, 0.45);
          }

          .hint {
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: 16px;
            background: #eff6ff;
            color: #1d4ed8;
          }

          .stack {
            display: grid;
            gap: 16px;
          }

          .grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
          }

          button,
          select {
            font: inherit;
          }


  metric-card::part(button) {
    background: #111827;
    color: white;
  }

  metric-card::part(value) {
    color: #7c3aed;
  }

        </style>
      </head>
      <body>
        <main>
          <p class="eyebrow">02-styling / 04-part</p>
          <h1>Expose internal elements with ::part()</h1>
          <p class="summary">internal DOM 全体は見せずに、一部だけ styling hook を公開したいときに `part` を使います。</p>

          <ul class="nav"><li><a href="../../index.html">examples index</a></li><li><a href="../03-host-context/index.html">← previous</a></li><li><a href="../05-combined/index.html">next →</a></li></ul>

          <section class="demo">

<metric-card label="Pull Requests" value="18"></metric-card>
<p class="hint">外側のページから `metric-card::part(button)` と `metric-card::part(value)` を上書きしています。</p>

          </section>
        </main>

        <script>

class MetricCard extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
  }

  connectedCallback() {
    const label = this.getAttribute('label') ?? 'Metric';
    const value = this.getAttribute('value') ?? '0';
    this.shadowRoot.innerHTML = `
      <style>
        article {
          padding: 20px;
          border-radius: 20px;
          background: white;
          border: 1px solid #e2e8f0;
        }

        button {
          border: 0;
          border-radius: 999px;
          background: #dbeafe;
          color: #1d4ed8;
          padding: 10px 16px;
        }
      </style>
      <article>
        <p>${label}</p>
        <h2 part="value">${value}</h2>
        <button type="button" part="button">Inspect part</button>
      </article>
    `;
  }
}

customElements.define('metric-card', MetricCard);

        </script>
      </body>
    </html>
