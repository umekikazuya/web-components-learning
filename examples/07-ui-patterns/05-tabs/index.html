    <!doctype html>

      <body>
        <main>
          <p class="eyebrow">07-ui-patterns / 05-tabs</p>
          <h1>Build accessible tabs with roles and keyboard support</h1>
<p class="summary">tabs は composite widget の代表例です。role と roving focus に加えて、Arrow / Home / End キーの最小サポートも実装します。</p>
          <ul class="nav"><li><a href="../../index.html">examples index</a></li><li><a href="../04-popover-menu/index.html">← previous</a></li><li><a href="../06-menu-button/index.html">next →</a></li></ul>
          <section class="demo">

<demo-tabs></demo-tabs>

          </section>
        </main>
        <script>

class DemoTabs extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
    this.selectedIndex = 0;
  }

  connectedCallback() {
    this.render();
  }

  select(index) {
    this.selectedIndex = index;
    this.render();
  }

  render() {
    const tabs = ['Overview', 'API', 'Notes'];
    const panels = [
      'Tabs connect one active tab to one visible panel.',
      'Use role="tablist", role="tab", and role="tabpanel" together.',
      'Arrow keys move focus between tabs in this example.',
    ];

    const tabButtons = tabs.map((label, index) => `
      <button
        type="button"
        role="tab"
        id="tab-${index}"
        aria-selected="${index === this.selectedIndex ? 'true' : 'false'}"
        aria-controls="panel-${index}"
        tabindex="${index === this.selectedIndex ? '0' : '-1'}"
        data-index="${index}"
      >${label}</button>
    `).join('');

    const panel = `<section role="tabpanel" id="panel-${this.selectedIndex}" aria-labelledby="tab-${this.selectedIndex}">${panels[this.selectedIndex]}</section>`;

    this.shadowRoot.innerHTML = `
      <style>
        [role="tablist"] { display: flex; gap: 8px; margin-bottom: 16px; }
        [role="tab"] { border: 0; border-radius: 999px; padding: 10px 14px; background: #e2e8f0; cursor: pointer; }
        [role="tab"][aria-selected="true"] { background: #2563eb; color: white; }
        [role="tabpanel"] { padding: 18px; border-radius: 18px; background: white; border: 1px solid #dbeafe; }
      </style>
      <div role="tablist" aria-label="demo tabs">${tabButtons}</div>
      ${panel}
    `;

    this.shadowRoot.querySelectorAll('[role="tab"]').forEach((button) => {
      button.addEventListener('click', () => this.select(Number(button.dataset.index)));
      button.addEventListener('keydown', (event) => {
        if (!['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(event.key)) {
          return;
        }
        event.preventDefault();
        const current = Number(button.dataset.index);
        const next = event.key === 'Home'
          ? 0
          : event.key === 'End'
            ? tabs.length - 1
            : event.key === 'ArrowRight'
              ? (current + 1) % tabs.length
              : (current - 1 + tabs.length) % tabs.length;
        this.select(next);
        this.shadowRoot.querySelector(`[data-index="${next}"]`)?.focus();
      });
    });
  }
}

customElements.define('demo-tabs', DemoTabs);

        </script>
      </body>
