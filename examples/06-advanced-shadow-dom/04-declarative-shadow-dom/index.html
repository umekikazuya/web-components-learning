          <p class="eyebrow">06-advanced-shadow-dom / 04-declarative-shadow-dom</p>
          <h1>Start with Declarative Shadow DOM</h1>
          <p class="summary">`<template shadowrootmode="open">` を使うと、HTML 側に shadow root の初期内容を書けます。</p>
          <ul class="nav"><li><a href="../../index.html">examples index</a></li><li><a href="../03-updating-sheet/index.html">← previous</a></li><li><a href="../05-upgrade-declarative-shadow/index.html">next →</a></li></ul>
          <section class="learning-guide" aria-label="step guide">
        <article class="guide-card">
          <h2>この step で増えるもの</h2>
          <p>&amp;lt;template shadowrootmode="open"&amp;gt; を使って、HTML だけで shadow root の初期内容を書きます。</p>
        </article>
        <article class="guide-card">
          <h2>前stepと比べる点</h2>

        </article>
        <article class="guide-card">

      <section class="demo">

<declarative-card>
  <template shadowrootmode="open">
    <style>
      article { padding: 22px; border-radius: 20px; background: white; border: 1px solid #dbeafe; }
      .eyebrow { color: #2563eb; font-weight: 700; }
    </style>
    <article>
      <p class="eyebrow">Declarative Shadow DOM</p>
      <h2>Initial HTML-defined shadow root</h2>
      <p class="status">waiting for detection...</p>
    </article>
  </template>
</declarative-card>
<p class="hint" id="dsd-log">まず markup を見て、template shadowrootmode だけで初期 UI を書いていることを確認してください。</p>

          </section>
        </main>
        <script>

class DeclarativeCard extends HTMLElement {
  connectedCallback() {
    if (!this.shadowRoot) {
      this.attachShadow({ mode: 'open' });
      this.shadowRoot.innerHTML = '<article>Declarative Shadow DOM not parsed in this environment.</article>';
    }

    const status = this.shadowRoot.querySelector('.status');
    if (status) {
      status.textContent = 'HTML だけで shadow root が用意され、そのあと custom element が upgrade されました。';
    }
  }
}

customElements.define('declarative-card', DeclarativeCard);

const supportsDeclarativeShadowDom = 'shadowRootMode' in HTMLTemplateElement.prototype;
document.getElementById('dsd-log').textContent = document.querySelector('declarative-card').shadowRoot
  ? `まず markup を見てください。support note: ${supportsDeclarativeShadowDom ? 'Declarative Shadow DOM は利用可能、または upgrade 前に parse されています。' : 'この環境では Declarative Shadow DOM を使えないため、attachShadow() へ fallback しています。'}`
  : 'shadow root を確認できませんでした。';

        </script>
