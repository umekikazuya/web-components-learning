    <!doctype html>
    <html lang="ja">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Reuse markup with template</title>
        <style>
          :root {
            color-scheme: light;
            font-family: Inter, system-ui, sans-serif;
            line-height: 1.6;
          }

          * {
            box-sizing: border-box;
          }

          body {
            margin: 0;
            background: #f8fafc;
            color: #0f172a;
          }

          main {
            max-width: 980px;
            margin: 0 auto;
            padding: 36px 20px 72px;
          }

          .eyebrow {
            margin: 0 0 8px;
            color: #2563eb;
            font-weight: 700;
            font-size: 0.875rem;
          }

          h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 4vw, 2.8rem);
          }

          p {
            margin-top: 0;
          }

          .summary {
            max-width: 68ch;
            color: #475569;
          }

          .nav {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            padding: 0;
            margin: 24px 0 0;
            list-style: none;
          }

          .nav a {
            display: inline-flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 999px;
            background: white;
            border: 1px solid #dbeafe;
            color: #2563eb;
            text-decoration: none;
          }

          .demo {
            margin-top: 28px;
            padding: 24px;
            border-radius: 24px;
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 24px 48px -36px rgba(15, 23, 42, 0.45);
          }

          .hint {
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: 16px;
            background: #eff6ff;
            color: #1d4ed8;
          }

          .stack {
            display: grid;
            gap: 16px;
          }

          .grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
          }

          button,
          select {
            font: inherit;
          }


        </style>
      </head>
      <body>
        <main>
          <p class="eyebrow">01-shadow-dom / 03-template</p>
          <h1>Reuse markup with template</h1>
          <p class="summary">`<template>` を clone して Shadow DOM へ流し込み、構造を 1 箇所で保守する基本形を試します。</p>

          <ul class="nav"><li><a href="../../index.html">examples index</a></li><li><a href="../02-first-shadow/index.html">← previous</a></li><li><a href="../04-default-slot/index.html">next →</a></li></ul>

          <section class="demo">

<template id="profile-template">
  <style>
    article {
      padding: 20px;
      border-radius: 18px;
      background: white;
      border: 1px solid #dbeafe;
    }

    .role {
      color: #2563eb;
      font-weight: 700;
    }
  </style>
  <article>
    <p class="role" data-role></p>
    <h2 data-name></h2>
    <p data-description></p>
  </article>
</template>

<div class="grid">
  <template-profile-card name="Aiko" role="Engineer" description="Shadow DOM と styling API を調べています。"></template-profile-card>
  <template-profile-card name="Ren" role="Designer" description="slots と layout composition を検証しています。"></template-profile-card>
</div>

          </section>
        </main>

        <script>

const template = document.getElementById('profile-template');

class TemplateProfileCard extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
  }

  connectedCallback() {
    const fragment = template.content.cloneNode(true);
    fragment.querySelector('[data-name]').textContent = this.getAttribute('name') ?? 'Anonymous';
    fragment.querySelector('[data-role]').textContent = this.getAttribute('role') ?? 'Role';
    fragment.querySelector('[data-description]').textContent = this.getAttribute('description') ?? '';
    this.shadowRoot.replaceChildren(fragment);
  }
}

customElements.define('template-profile-card', TemplateProfileCard);

        </script>
      </body>
    </html>
