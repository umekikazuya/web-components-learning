          :root {

          }

      <body>
        <main>
          <p class="eyebrow">01-shadow-dom / 04-default-slot</p>
          <h1>Accept light DOM through a default slot</h1>
          <p class="summary">default slot を使うと、内部構造を守りながら本文だけを親から差し込めます。</p>

          <ul class="nav"><li><a href="../../index.html">examples index</a></li><li><a href="../03-template/index.html">← previous</a></li><li><a href="../05-named-slots/index.html">next →</a></li></ul>

          <section class="demo">

<div class="stack">
  <note-frame>
    <p>この段落は light DOM 側で書いた内容で、slot を通して表示されています。</p>
  </note-frame>
  <note-frame></note-frame>
</div>

          </section>
        </main>

        <script>

class NoteFrame extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
  }

  connectedCallback() {
    this.shadowRoot.innerHTML = `
      <style>
        article {
          padding: 20px;
          border-radius: 18px;
          background: #f8fafc;
          border: 1px solid #cbd5e1;
        }
      </style>
      <article>
        <h2>Default slot</h2>
        <slot>slot に内容が来ない場合の fallback です。</slot>
      </article>
    `;
  }
}

customElements.define('note-frame', NoteFrame);

        </script>
      </body>
