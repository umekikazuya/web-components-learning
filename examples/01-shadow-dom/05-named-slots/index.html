    <!doctype html>
    <html lang="ja">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Split layout with named slots and notify with events</title>
        <style>
          :root {
            color-scheme: light;
            font-family: Inter, system-ui, sans-serif;
            line-height: 1.6;
          }

          * {
            box-sizing: border-box;
          }

          body {
            margin: 0;
            background: #f8fafc;
            color: #0f172a;
          }

          main {
            max-width: 980px;
            margin: 0 auto;
            padding: 36px 20px 72px;
          }

          .eyebrow {
            margin: 0 0 8px;
            color: #2563eb;
            font-weight: 700;
            font-size: 0.875rem;
          }

          h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 4vw, 2.8rem);
          }

          p {
            margin-top: 0;
          }

          .summary {
            max-width: 68ch;
            color: #475569;
          }

          .nav {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            padding: 0;
            margin: 24px 0 0;
            list-style: none;
          }

          .nav a {
            display: inline-flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 999px;
            background: white;
            border: 1px solid #dbeafe;
            color: #2563eb;
            text-decoration: none;
          }

          .demo {
            margin-top: 28px;
            padding: 24px;
            border-radius: 24px;
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 24px 48px -36px rgba(15, 23, 42, 0.45);
          }

          .hint {
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: 16px;
            background: #eff6ff;
            color: #1d4ed8;
          }

          .stack {
            display: grid;
            gap: 16px;
          }

          .grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
          }

          button,
          select {
            font: inherit;
          }


        </style>
      </head>
      <body>
        <main>
          <p class="eyebrow">01-shadow-dom / 05-named-slots</p>
          <h1>Split layout with named slots and notify with events</h1>
          <p class="summary">title / actions / body を分離しつつ、内部操作を `CustomEvent` で外に返す例です。</p>

          <ul class="nav"><li><a href="../../index.html">examples index</a></li><li><a href="../04-default-slot/index.html">← previous</a></li></ul>

          <section class="demo">

<panel-shell id="panel-shell">
  <span slot="title">Release note</span>
  <button slot="actions" type="button">external action</button>
  <p>本文は default slot から差し込まれます。header と actions は named slot で分けています。</p>
</panel-shell>
<p id="slot-log" class="hint">まだイベントは発生していません。</p>

          </section>
        </main>

        <script>

class PanelShell extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
  }

  connectedCallback() {
    this.shadowRoot.innerHTML = `
      <style>
        article {
          padding: 22px;
          border-radius: 20px;
          background: white;
          border: 1px solid #dbeafe;
        }

        header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 16px;
        }

        button {
          border: 0;
          border-radius: 999px;
          background: #2563eb;
          color: white;
          padding: 10px 16px;
          cursor: pointer;
        }
      </style>
      <article>
        <header>
          <slot name="title">Untitled</slot>
          <slot name="actions"></slot>
        </header>
        <div>
          <slot></slot>
        </div>
        <button id="close-button" type="button">internal dismiss</button>
      </article>
    `;

    this.shadowRoot.getElementById('close-button').addEventListener('click', () => {
      this.dispatchEvent(new CustomEvent('panel-close', {
        detail: { source: 'internal button' },
        bubbles: true,
        composed: true,
      }));
    });
  }
}

customElements.define('panel-shell', PanelShell);

document.getElementById('panel-shell').addEventListener('panel-close', (event) => {
  document.getElementById('slot-log').textContent = `panel-close: ${event.detail.source}`;
});

        </script>
      </body>
    </html>
