    <!doctype html>
    <html lang="ja">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Create your first Shadow DOM</title>
        <style>
          :root {
            color-scheme: light;
            font-family: Inter, system-ui, sans-serif;
            line-height: 1.6;
          }

          * {
            box-sizing: border-box;
          }

          body {
            margin: 0;
            background: #f8fafc;
            color: #0f172a;
          }

          main {
            max-width: 980px;
            margin: 0 auto;
            padding: 36px 20px 72px;
          }

          .eyebrow {
            margin: 0 0 8px;
            color: #2563eb;
            font-weight: 700;
            font-size: 0.875rem;
          }

          h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 4vw, 2.8rem);
          }

          p {
            margin-top: 0;
          }

          .summary {
            max-width: 68ch;
            color: #475569;
          }

          .nav {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            padding: 0;
            margin: 24px 0 0;
            list-style: none;
          }

          .nav a {
            display: inline-flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 999px;
            background: white;
            border: 1px solid #dbeafe;
            color: #2563eb;
            text-decoration: none;
          }

          .demo {
            margin-top: 28px;
            padding: 24px;
            border-radius: 24px;
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 24px 48px -36px rgba(15, 23, 42, 0.45);

          .hint {

          button,
          select {
            font: inherit;
          }


  .card {
    padding: 22px;
    border-radius: 20px;
    background: #fee2e2;
    border: 3px dashed #ef4444;
  }

  button {
    border: 0;
    border-radius: 999px;
    background: #111827;

    padding: 10px 16px;
  }

        </style>
      </head>
      <body>
        <main>
          <p class="eyebrow">01-shadow-dom / 02-first-shadow</p>
          <h1>Create your first Shadow DOM</h1>
          <p class="summary">同じような UI を Shadow DOM へ入れると、ページ側 CSS の影響を遮断できることがわかります。</p>

          <ul class="nav"><li><a href="../../index.html">examples index</a></li><li><a href="../01-without-shadow/index.html">← previous</a></li><li><a href="../03-template/index.html">next →</a></li></ul>

          <section class="demo">

<shadow-profile-card></shadow-profile-card>
<p class="hint">ページ側には派手な `.card` と `button` のスタイルがありますが、内部 UI は独立しています。</p>

          </section>
        </main>

        <script>

class ShadowProfileCard extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
  }

  connectedCallback() {
    this.shadowRoot.innerHTML = `
      <style>
        article {
          padding: 22px;
          border-radius: 20px;
          background: white;
          border: 1px solid #bfdbfe;
          box-shadow: 0 20px 40px -32px rgba(15, 23, 42, 0.4);
        }

        button {
          border: 0;
          border-radius: 999px;
          background: #2563eb;
          color: white;
          padding: 10px 16px;
          cursor: pointer;
        }
      </style>
      <article>
        <h2>With Shadow DOM</h2>
        <p>内部の DOM とスタイルを閉じ込められます。</p>
        <button type="button">Scoped button</button>
      </article>
    `;
  }
}

customElements.define('shadow-profile-card', ShadowProfileCard);

        </script>
      </body>
    </html>
