        <title>React to disabled state with formDisabledCallback</title>
        <style>

  #toggle-fieldset { inline-size: fit-content; border: 0; border-radius: 999px; background: #2563eb; color: white; padding: 10px 16px; cursor: pointer; }

      <body>
        <main>
          <p class="eyebrow">05-forms-and-element-internals / 04-disabled-callback</p>
          <h1>React to disabled state with formDisabledCallback</h1>
          <p class="summary">fieldset の disabled 状態が custom element に伝わると、内部 input を一括で操作不能にできます。</p>
          <ul class="nav"><li><a href="../../index.html">examples index</a></li><li><a href="../03-validation/index.html">← previous</a></li><li><a href="../05-rating-input/index.html">next →</a></li></ul>
          <section class="demo">

<div class="stack">
  <button id="toggle-fieldset" type="button">fieldset disabled を切り替える</button>
  <form>
    <fieldset id="fieldset-shell">
      <availability-field name="assignee" value="open"></availability-field>
    </fieldset>
  </form>
  <p id="disabled-log" class="hint">現在の状態: enabled</p>
</div>

          </section>
        </main>
        <script>

class AvailabilityField extends HTMLElement {
  static formAssociated = true;

  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
    this.internals = this.attachInternals?.() ?? null;
    this.disabled = false;
  }

  connectedCallback() {
    this.render();
  }

  formDisabledCallback(disabled) {
    this.disabled = disabled;
    this.render();
    document.getElementById('disabled-log').textContent = `現在の状態: ${disabled ? 'disabled' : 'enabled'}`;
  }

  render() {
    this.shadowRoot.innerHTML = `
      <style>
        label { display: grid; gap: 8px; font-weight: 700; opacity: ${this.disabled ? '0.55' : '1'}; }
        select { padding: 10px 12px; border-radius: 12px; border: 1px solid #cbd5e1; }
      </style>
      <label>
        Assignee status
        <select ${this.disabled ? 'disabled' : ''}>
          <option value="open">open</option>
          <option value="busy">busy</option>
          <option value="offline">offline</option>
        </select>
      </label>
    `;
  }
}

customElements.define('availability-field', AvailabilityField);

const shell = document.getElementById('fieldset-shell');
document.getElementById('toggle-fieldset').addEventListener('click', () => {
  shell.disabled = !shell.disabled;
});

        </script>
