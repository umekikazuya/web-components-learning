          <body>
            <main>
              <p class="eyebrow">05-forms-and-element-internals / 01-associated-control</p>
              <h1>Associate a custom element with a form</h1>
              <p class="summary">form-associated custom element の最小例です。内部入力の値を `setFormValue()` で form submit に参加させます。</p>
              <ul class="nav"><li><a href="../../index.html">examples index</a></li><li><a href="../02-reset-callback/index.html">next →</a></li></ul>
              <section class="demo">

    <form id="associated-form" class="stack">
      <face-text name="topic" value="shadow-dom"></face-text>
      <div class="controls">
        <button type="submit">submit</button>
      </div>
    </form>
    <pre id="associated-log" class="hint">Submit すると FormData がここに表示されます。</pre>

              </section>
            </main>
            <script>

    const supportsFACE = 'ElementInternals' in window && 'attachInternals' in HTMLElement.prototype;

    class FaceText extends HTMLElement {
      static formAssociated = true;
      static observedAttributes = ['value'];

      constructor() {
        super();
        this.attachShadow({ mode: 'open' });
        this.internals = this.attachInternals?.() ?? null;
      }

      connectedCallback() {
        this.render();
        this.syncValue(this.getAttribute('value') ?? '');
      }

      attributeChangedCallback() {
        this.render();
        this.syncValue(this.getAttribute('value') ?? '');
      }

      syncValue(value) {
        if (this.internals) {
          this.internals.setFormValue(value);
        }

        const input = this.shadowRoot?.querySelector('input');
        if (input && input.value !== value) {
          input.value = value;
        }
      }

      render() {
        this.shadowRoot.innerHTML = `
          <style>
            label { display: grid; gap: 8px; font-weight: 700; }
            input { padding: 10px 12px; border-radius: 12px; border: 1px solid #cbd5e1; }
            .meta { color: #475569; font-size: 0.875rem; }
          </style>
          <label>
            Topic name
            <input type="text" value="${this.getAttribute('value') ?? ''}">
          </label>
          <p class="meta">support: ${supportsFACE ? 'form-associated custom elements available' : 'fallback only'}</p>
        `;

        this.shadowRoot.querySelector('input').addEventListener('input', (event) => {
          const value = event.target.value;
          this.setAttribute('value', value);
          this.syncValue(value);
        });
      }
    }

    customElements.define('face-text', FaceText);

    document.getElementById('associated-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const formData = new FormData(event.currentTarget);
      const pairs = [...formData.entries()].map(([key, value]) => `${key}=${value}`);
      document.getElementById('associated-log').textContent = pairs.join('\\n') || '(no form-associated value available in this browser)';
    });

            </script>
          </body>
