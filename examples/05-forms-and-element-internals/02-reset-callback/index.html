      <body>
        <main>
          <p class="eyebrow">05-forms-and-element-internals / 02-reset-callback</p>
          <h1>Reset internal state with formResetCallback</h1>
          <p class="summary">form reset 時に custom element の内部値も初期状態へ戻せることを確認します。</p>
          <ul class="nav"><li><a href="../../index.html">examples index</a></li><li><a href="../01-associated-control/index.html">← previous</a></li><li><a href="../03-validation/index.html">next →</a></li></ul>
          <section class="demo">

<form id="reset-form" class="stack">
  <reset-field name="nickname" value="copilot"></reset-field>
  <div class="controls">
    <button type="reset">reset</button>
  </div>
</form>

          </section>
        </main>
        <script>

class ResetField extends HTMLElement {
  static formAssociated = true;

  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
    this.internals = this.attachInternals?.() ?? null;
    this.defaultValue = this.getAttribute('value') ?? '';
  }

  connectedCallback() {
    this.render();
    this.setValue(this.defaultValue);
  }

  setValue(value) {
    this.value = value;
    this.internals?.setFormValue(value);
    const input = this.shadowRoot?.querySelector('input');
    if (input && input.value !== value) {
      input.value = value;
    }
  }

  formResetCallback() {
    this.setValue(this.defaultValue);
  }

  render() {
    this.shadowRoot.innerHTML = `
      <style>
        label { display: grid; gap: 8px; font-weight: 700; }
        input { padding: 10px 12px; border-radius: 12px; border: 1px solid #cbd5e1; }
        .meta { color: #475569; font-size: 0.875rem; }
      </style>
      <label>
        Nickname
        <input type="text" value="${this.defaultValue}">
      </label>
      <p class="meta">reset すると初期値 ${this.defaultValue} に戻ります。</p>
    `;

    this.shadowRoot.querySelector('input').addEventListener('input', (event) => {
      this.setValue(event.target.value);
    });
  }
}

customElements.define('reset-field', ResetField);

        </script>
